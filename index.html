<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Signal Chat Room</title>
    
    <!-- PWA Meta Tags & Icons -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar for chat feel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Top Chat Room Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center gap-3">
            <button class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-arrow-left text-lg"></i></button>
            <div class="relative">
                <div class="w-10 h-10 rounded-full bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold">
                    <i class="fa-solid fa-[#]"></i>
                </div>
                <span class="w-3 h-3 bg-emerald-500 rounded-full absolute bottom-0 right-0 border-2 border-slate-900"></span>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="font-bold text-base text-slate-100 tracking-wide">signal-auditor</h1>
                    <span class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded-md">Bot</span>
                </div>
                <p class="text-xs text-emerald-400 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Online • Llama 3.1 & Vector Memory
                </p>
            </div>
        </div>
        <div class="flex items-center gap-4 text-slate-400">
            <button onclick="fetchHistory()" title="Refresh Feed" class="hover:text-slate-200"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="hover:text-slate-200"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </header>

    <!-- Chat Messages Feed -->
    <main id="chatFeed" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        
        <!-- Date Divider -->
        <div class="flex items-center justify-center my-2">
            <span class="bg-slate-900 text-slate-500 text-[11px] font-semibold px-3 py-1 rounded-full border border-slate-800/80">
                Today
            </span>
        </div>

        <!-- Welcome Bot Message -->
        <div class="flex gap-3 max-w-[85%]">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold shrink-0 mt-1">
                AI
            </div>
            <div class="space-y-1">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-indigo-400">TRACE SIGNAL AUDITOR</span>
                    <span class="text-[10px] text-slate-500">System</span>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl rounded-tl-xs text-sm text-slate-200 leading-relaxed shadow-md">
                    👋 Welcome! Paste any raw trade signal or setup message below (e.g., <code>XAUUSD BUY NOW 2420 SL 2410 TP 2450</code>). I'll audit it against your PDF strategy manuals and past mistakes in real-time!
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Fixed Chat Input Bar -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3 z-10">
        <form id="chatForm" class="max-w-4xl mx-auto flex items-center gap-2">
            <div class="relative flex-1">
                <textarea id="messageInput" rows="1" placeholder="Type or paste trade signal message..." required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 resize-none pr-10"></textarea>
            </div>
            <button type="submit" id="sendBtn" 
                class="w-11 h-11 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-indigo-600/30 transition-all shrink-0">
                <i class="fa-solid fa-arrow-up text-lg"></i>
            </button>
        </form>
    </footer>

    <!-- Chat JavaScript Code -->
    <script>
        const API_BASE = "http://127.0.0.1:8000";
        const chatFeed = document.getElementById('chatFeed');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');

        // Auto-scroll chat to bottom
        function scrollToBottom() {
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        // Add user speech bubble
        function appendUserMessage(text) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const html = `
                <div class="flex justify-end my-3">
                    <div class="max-w-[80%] space-y-1">
                        <div class="bg-indigo-600 text-white p-3.5 rounded-2xl rounded-tr-xs text-sm shadow-md whitespace-pre-wrap font-mono">
                            ${text}
                        </div>
                        <div class="text-[10px] text-slate-500 text-right">${time}</div>
                    </div>
                </div>
            `;
            chatFeed.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        // Add AI bot response bubble
        function appendBotMessage(text) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const html = `
                <div class="flex gap-3 max-w-[88%] my-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold shrink-0 mt-1">
                        AI
                    </div>
                    <div class="space-y-1 flex-1">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-indigo-400">TRACE SIGNAL AUDITOR</span>
                            <span class="text-[10px] text-slate-500">${time}</span>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl rounded-tl-xs text-sm text-slate-200 leading-relaxed shadow-md whitespace-pre-wrap font-mono">
                            ${text}
                        </div>
                    </div>
                </div>
            `;
            chatFeed.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        // Show typing indicator
        function appendTypingIndicator() {
            const id = 'typing-' + Date.now();
            const html = `
                <div id="${id}" class="flex gap-3 max-w-[85%] my-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold shrink-0">
                        AI
                    </div>
                    <div class="bg-slate-900 border border-slate-800 px-4 py-3 rounded-2xl flex items-center gap-1.5">
                        <span class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce"></span>
                        <span class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                        <span class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                    </div>
                </div>
            `;
            chatFeed.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
            return id;
        }

        // Handle Form Submission
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            messageInput.value = '';
            appendUserMessage(text);

            const loaderId = appendTypingIndicator();

            try {
                const response = await fetch(`${API_BASE}/chat-audit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                document.getElementById(loaderId)?.remove();

                if (response.ok) {
                    appendBotMessage(data.reply);
                } else {
                    appendBotMessage(`⚠️ Error: ${data.detail}`);
                }
            } catch (err) {
                document.getElementById(loaderId)?.remove();
                appendBotMessage("❌ Could not connect to FastAPI server. Check if 'python main.py' is running!");
            }
        });
    </script>
</body>
</html>
